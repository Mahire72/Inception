
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
	worker_connections 1024;
}

http{
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	server { 
		listen 443 ssl; # NGINX ECOUTE sur le prot 443 et activie TLS pour les connextions HTTPS
		server_name mamaimai.42.fr; #INDIQUE le nom de domaine auquel cette configuration correspond.

		ssl_protocols TLSv1.2 TLSv1.3; # autorise les version
		ssl_certificate /etc/nginx/ssl/inception.crt; # indique le chemnin de certificat public.
		ssl_certificate_key /etc/nginx/ssl/inception.key; # indique le chemin de la cle privee correspondante

		root /var/www/html;
		index index.php index.html;

		location / {
			try_files $uri $uri/ /index.php?$args;
		}

		location ~ \.php$ {
			try_files $uri =404;
			include fastcgi_params;
			fastcgi_pass wordpress:9000;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;	
		}
	}
}
