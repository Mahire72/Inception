services:
  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
      - adminer
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
      - adminer_files:/var/www/adminer:ro
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: always
    env_file:
      - .env
    depends_on:
      - mariadb
      - redis
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  static-website:
    build: ./requirements/bonus/static-website
    image: static-website
    container_name: static-website
    restart: always
    networks:
      - inception

  adminer:
    build: ./requirements/bonus/adminer
    image: adminer
    container_name: adminer
    restart: always
    depends_on:
      - mariadb
    volumes:
      - adminer_files:/var/www/adminer
    networks:
      - inception
    
  redis:
    build: ./requirements/bonus/redis
    image: redis
    container_name: redis
    restart: always
    env_file:
      - .env
    networks:
      - inception

  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mamaimai/data/wordpress

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mamaimai/data/mariadb
  
  adminer_files:
    driver: local

networks:
  inception:
    driver: bridge
